name: Publish GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instrumented:
    name: Verify Android behavior
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Build before starting the AVD. Compiling all test APKs while an Android
      # 35 emulator is running exhausts the resources of a standard hosted
      # runner and can make ADB unresponsive before the first installation.
      - name: Assemble Android behavior-test artifacts
        run: >-
          ./gradlew
          :ads-core:packageDebugAndroidTest
          :ads-compose:packageDebugAndroidTest
          :billing-google-play:packageDebugAndroidTest
          :app:assembleDebug
          :app:packageDebugAndroidTest
          :consumer-r8-smoke:assembleDebug
          :consumer-r8-smoke:packageDebugAndroidTest
          :consumer-r8-smoke:assembleRelease
          --stacktrace

      - name: Verify prebuilt Android test artifacts
        shell: bash
        run: |
          required_apks=(
            "ads-core/build/outputs/apk/androidTest/debug/ads-core-debug-androidTest.apk"
            "ads-compose/build/outputs/apk/androidTest/debug/ads-compose-debug-androidTest.apk"
            "billing-google-play/build/outputs/apk/androidTest/debug/billing-google-play-debug-androidTest.apk"
            "app/build/outputs/apk/debug/app-debug.apk"
            "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            "consumer-r8-smoke/build/outputs/apk/debug/consumer-r8-smoke-debug.apk"
            "consumer-r8-smoke/build/outputs/apk/androidTest/debug/consumer-r8-smoke-debug-androidTest.apk"
            "consumer-r8-smoke/build/outputs/apk/release/consumer-r8-smoke-release.apk"
          )

          for apk in "${required_apks[@]}"; do
            test -f "${apk}"
            echo "Found ${apk}"
          done

      # Matches the emulator action's recommended setup for GitHub-hosted
      # Linux runners. The action then verifies KVM access before it starts.
      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run behavior tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            bash scripts/ci/run-instrumented-tests.sh

  publish:
    name: Verify and publish Android libraries
    runs-on: ubuntu-latest
    needs: instrumented

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          test -n "${version}"
          if [[ "${version}" == *"SNAPSHOT"* ]]; then
            echo "GitHub Packages releases must not use a SNAPSHOT version." >&2
            exit 1
          fi
          if ! [[ "${version}" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Use a numeric release version such as 0.1.0 or 0.1.0-rc01." >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./gradlew \
            testDebugUnitTest \
            :consumer-r8-smoke:assembleRelease \
            :consumer-r8-smoke:analyzeReleaseR8Config \
            publish \
            "-Pmonetizekit.version=${PUBLISH_VERSION}" \
            --stacktrace
