name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  android:
    name: Android verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run all unit tests and analyze the minified consumer
        run: >-
          ./gradlew testDebugUnitTest
          :consumer-r8-smoke:assembleRelease
          :consumer-r8-smoke:analyzeReleaseR8Config
          --stacktrace

      - name: Verify mediation adapters survive R8
        shell: bash
        run: |
          apk="consumer-r8-smoke/build/outputs/apk/release/consumer-r8-smoke-release.apk"
          analyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          "${analyzer}" dex packages "${apk}" | grep -Fq "com.google.ads.mediation.facebook.FacebookMediationAdapter"
          "${analyzer}" dex packages "${apk}" | grep -Fq "com.google.ads.mediation.unity.UnityMediationAdapter"
          "${analyzer}" dex packages "${apk}" | grep -Fq "ua.lujek.monetizekit.mediation.meta.MetaAdMobMediationInitializer"

  instrumented:
    name: Android instrumented verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # GitHub's Linux image exposes /dev/kvm, but the runner user does not
      # receive access by default. Without this rule the emulator action falls
      # back to software emulation (-accel off), which can leave ADB offline.
      - name: Enable KVM access for the Android emulator
        shell: bash
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run behavior tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            bash scripts/ci/run-instrumented-tests.sh
