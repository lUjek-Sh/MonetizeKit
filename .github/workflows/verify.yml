name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  android:
    name: Android verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run all unit tests and analyze the minified consumer
        run: >-
          ./gradlew testDebugUnitTest
          :consumer-r8-smoke:assembleRelease
          :ads-unity-sdk:generatePomFileForReleasePublication
          :ads-admob-unity-mediation:generatePomFileForReleasePublication
          :consumer-r8-smoke:analyzeReleaseR8Config
          --stacktrace

      - name: Verify mediation adapters survive R8
        shell: bash
        run: |
          apk="consumer-r8-smoke/build/outputs/apk/release/consumer-r8-smoke-release.apk"
          analyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          "${analyzer}" dex packages "${apk}" | grep -Fq "com.google.ads.mediation.facebook.FacebookMediationAdapter"
          "${analyzer}" dex packages "${apk}" | grep -Fq "com.google.ads.mediation.unity.UnityMediationAdapter"
          "${analyzer}" dex packages "${apk}" | grep -Fq "ua.lujek.monetizekit.mediation.meta.MetaAdMobMediationInitializer"

          unity_sdk_pom="ads-unity-sdk/build/publications/release/pom-default.xml"
          unity_mediation_pom="ads-admob-unity-mediation/build/publications/release/pom-default.xml"
          grep -Fq "<artifactId>unity-ads</artifactId>" "${unity_sdk_pom}"
          grep -Fq "<artifactId>ads-unity-sdk</artifactId>" "${unity_mediation_pom}"

  instrumented:
    name: Android instrumented verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Build before starting the AVD. Compiling all test APKs while an Android
      # 35 emulator is running exhausts the resources of a standard hosted
      # runner and can make ADB unresponsive before the first installation.
      - name: Assemble Android behavior-test artifacts
        run: >-
          ./gradlew
          :ads-core:packageDebugAndroidTest
          :ads-compose:packageDebugAndroidTest
          :billing-google-play:packageDebugAndroidTest
          :app:assembleDebug
          :app:packageDebugAndroidTest
          :consumer-r8-smoke:assembleDebug
          :consumer-r8-smoke:packageDebugAndroidTest
          :consumer-r8-smoke:assembleRelease
          --stacktrace

      - name: Verify prebuilt Android test artifacts
        shell: bash
        run: |
          required_apks=(
            "ads-core/build/outputs/apk/androidTest/debug/ads-core-debug-androidTest.apk"
            "ads-compose/build/outputs/apk/androidTest/debug/ads-compose-debug-androidTest.apk"
            "billing-google-play/build/outputs/apk/androidTest/debug/billing-google-play-debug-androidTest.apk"
            "app/build/outputs/apk/debug/app-debug.apk"
            "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            "consumer-r8-smoke/build/outputs/apk/debug/consumer-r8-smoke-debug.apk"
            "consumer-r8-smoke/build/outputs/apk/androidTest/debug/consumer-r8-smoke-debug-androidTest.apk"
            "consumer-r8-smoke/build/outputs/apk/release/consumer-r8-smoke-release.apk"
          )

          for apk in "${required_apks[@]}"; do
            test -f "${apk}"
            echo "Found ${apk}"
          done

      # Matches the emulator action's recommended setup for GitHub-hosted
      # Linux runners. The action then verifies KVM access before it starts.
      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run behavior tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          script: |
            bash scripts/ci/run-instrumented-tests.sh
