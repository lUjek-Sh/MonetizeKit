name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  android:
    name: Android verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run core unit tests and R8 consumer smoke test
        run: ./gradlew :ads-core:testDebugUnitTest :consumer-r8-smoke:assembleRelease --stacktrace
